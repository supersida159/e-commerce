version: '3.8'

services:
  # Infrastructure Services
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Tungpro123@"
      MYSQL_DATABASE: "e-commerce"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservices-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - microservices-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_VERSION: "2.8.0"
    networks:
      - microservices-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - microservices-network

  # Application Services
  create-order-service:
    build:
      context: ./api-services/create-order-service
      dockerfile: Dockerfile
    container_name: create-order-service
    ports:
      - "8090:8090"
      - "8889:8889"
    environment:
      ENVIRONMENT: "Development"
      DATABASE_URI: "root:Tungpro123@@tcp(mysql:3306)/e-commerce?parseTime=true"
      REDIS_URI: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
    volumes:
      - ./api-services/create-order-service/config.yaml:/app/config.yaml
    depends_on:
      - mysql
      - redis
      - kafka
    networks:
      - microservices-network

  update-cart-service:
    build:
      context: ./api-services/update-cart-service
      dockerfile: Dockerfile
    container_name: update-cart-service
    environment:
      ENVIRONMENT: "Development"
      DATABASE_URI: "root:Tungpro123@@tcp(mysql:3306)/e-commerce?parseTime=true"
      REDIS_URI: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
    volumes:
      - ./api-services/update-cart-service/config.yaml:/app/config.yaml
    depends_on:
      - mysql
      - redis
      - kafka
    networks:
      - microservices-network

  update-inventory-service:
    build:
      context: ./api-services/update-inventory-service
      dockerfile: Dockerfile
    container_name: update-inventory-service
    environment:
      ENVIRONMENT: "Development"
      DATABASE_URI: "root:Tungpro123@@tcp(mysql:3306)/e-commerce?parseTime=true"
      REDIS_URI: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
    volumes:
      - ./api-services/update-inventory-service/config.yaml:/app/config.yaml
    depends_on:
      - mysql
      - redis
      - kafka
    networks:
      - microservices-network

  # Each service should have its own Dockerfile in its directory
  workflow:
    build:
      context: ./api-services/workflow
      dockerfile: Dockerfile
    container_name: workflow
    environment:
      ENVIRONMENT: "Development"
      DATABASE_URI: "root:Tungpro123@@tcp(mysql:3306)/e-commerce?parseTime=true"
      REDIS_URI: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
    volumes:
      - ./api-services/workflow/config.yaml:/app/config.yaml
    depends_on:
      - mysql
      - redis
      - kafka
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  mysql_data: