
services:
  # Infrastructure Services
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Tungpro123@"
      MYSQL_DATABASE: "e-commerce"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - microservices-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservices-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_VERSION: "2.8.0"
    networks:
      - microservices-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - microservices-network

  # Monitoring Stack
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - microservices-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - microservices-network

  k6:
    image: grafana/k6:latest
    container_name: k6
    ports:
      - "6565:6565"
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    volumes:
      - ./k6/scripts:/scripts
    depends_on:
      - influxdb
    networks:
      - microservices-network
      
    entrypoint: >
      /bin/sh -c "
      echo 'Running k6 test...' &&
      k6 run -o influxdb=http://influxdb:8086/k6 /scripts/create-order-test.js
      "

  

  # Application Services
  api-services:
    build:
      context: ./api-services
      dockerfile: Dockerfile
    container_name: api-services
    ports:
      - "8090:8090"
      - "8889:8889"
    environment:
      ENVIRONMENT: "Development"
      DATABASE_URI: "root:Tungpro123@@tcp(mysql:3306)/e-commerce?parseTime=true"
      REDIS_URI: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
    volumes:
      - ./api-services/pkg/config/config.sample.yaml:/app/pkg/config/config.sample.yaml 
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - microservices-network

  create-order-service:
    build:
      context: ./create-order-service
      dockerfile: Dockerfile
    container_name: create-order-service
    ports:
      - "8091:8090"
      - "8890:8889"
    environment:
      ENVIRONMENT: "Development"
      DATABASE_URI: "root:Tungpro123@@tcp(mysql:3306)/e-commerce?parseTime=true"
      REDIS_URI: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
    volumes:
      - ./create-order-service/pkg/config/config.sample.yaml:/app/pkg/config/config.sample.yaml 
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - microservices-network

  update-cart-service:
    build:
      context: ./update-cart-service
      dockerfile: Dockerfile
    container_name: update-cart-service
    ports:
      - "8092:8090"
    environment:
      ENVIRONMENT: "Development"
      DATABASE_URI: "root:Tungpro123@@tcp(mysql:3306)/e-commerce?parseTime=true"
      REDIS_URI: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
    volumes:
      - ./update-cart-service/pkg/config/config.sample.yaml:/app/pkg/config/config.sample.yaml 
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - microservices-network

  update-inventory-service:
    build:
      context: ./update-inventory-service
      dockerfile: Dockerfile
    container_name: update-inventory-service
    ports:
      - "8093:8090"
    environment:
      ENVIRONMENT: "Development"
      DATABASE_URI: "root:Tungpro123@@tcp(mysql:3306)/e-commerce?parseTime=true"
      REDIS_URI: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
    volumes:
      - ./update-inventory-service/pkg/config/config.sample.yaml:/app/pkg/config/config.sample.yaml 
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  mysql_data:
  grafana_data:
  influxdb_data: